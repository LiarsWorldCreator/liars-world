<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Liar's World</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #1a1a2e;
            --panel: #16213e;
            --border: #0f3460;
            --gold: #c9a96e;
            --text: #e0d5c1;
            --text-dark: #8b7d6b;
            --danger: #8b3a3a;
            --success: #3a6b3a;
            --highlight: #2a4a7f;
            --chat-bg: #0d1b2a;
            --input-bg: #1c2a3a;
            --recording: #cc3333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image: radial-gradient(ellipse at top, rgba(201, 169, 110, 0.08) 0%, transparent 60%), radial-gradient(ellipse at bottom, rgba(15, 52, 96, 0.3) 0%, transparent 60%);
            -webkit-tap-highlight-color: transparent;
        }
        #top-bar {
            background: var(--panel); border-bottom: 1px solid var(--border);
            padding: 8px 12px; display: flex; justify-content: space-between;
            align-items: center; position: sticky; top: 0; z-index: 100;
            box-shadow: 0 2px 20px rgba(0,0,0,0.4); flex-wrap: wrap; gap: 6px;
        }
        #top-bar h1 { font-size: 1.1em; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; font-weight: normal; }
        #top-bar .subtitle { font-size: 0.6em; color: var(--text-dark); letter-spacing: 1px; display: block; }
        #user-area { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        #current-role-display { background: var(--highlight); padding: 4px 10px; border-radius: 4px; font-size: 0.75em; border: 1px solid var(--border); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .btn {
            background: var(--border); color: var(--text); border: 1px solid var(--gold);
            padding: 6px 12px; cursor: pointer; font-family: inherit; font-size: 0.75em;
            letter-spacing: 1px; border-radius: 3px; transition: all 0.2s; text-transform: uppercase;
            white-space: nowrap;
        }
        .btn:hover { background: var(--highlight); border-color: #e0c080; color: #fff; }
        .btn:active { transform: scale(0.96); }
        .btn.danger { border-color: var(--danger); background: transparent; }
        .btn.danger:hover { background: var(--danger); color: #fff; }
        .btn.small { padding: 4px 8px; font-size: 0.65em; }
        .btn.recording { background: var(--recording); border-color: #ff4444; animation: pulse 1s infinite; color: #fff; }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(204,51,51,0.5); } 50% { box-shadow: 0 0 0 12px rgba(204,51,51,0); } }
        #main-container { display: flex; height: calc(100vh - 100px); max-width: 1400px; margin: 0 auto; }
        #sidebar { width: 280px; background: var(--panel); border-right: 1px solid var(--border); padding: 14px 10px; overflow-y: auto; flex-shrink: 0; }
        #sidebar h2 { font-size: 0.8em; letter-spacing: 2px; color: var(--gold); margin-bottom: 12px; text-transform: uppercase; font-weight: normal; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .location-card { background: var(--chat-bg); border: 1px solid var(--border); padding: 10px 12px; margin-bottom: 8px; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
        .location-card:hover { border-color: var(--gold); }
        .location-card:active { transform: scale(0.97); }
        .location-card.active { border-color: var(--gold); box-shadow: 0 0 12px rgba(201,169,110,0.2); background: #121e32; }
        .location-card .name { font-size: 0.9em; letter-spacing: 1px; }
        .location-card .capacity { font-size: 0.65em; color: var(--text-dark); }
        .location-card .capacity.full { color: var(--danger); }
        .location-card .icon { font-size: 1.2em; margin-right: 6px; vertical-align: middle; }
        .location-card.special { border-style: dashed; border-color: #5a4a3a; }
        #chat-area { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); }
        #chat-header { background: var(--panel); padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        #chat-header h3 { font-weight: normal; letter-spacing: 2px; color: var(--gold); font-size: 0.9em; }
        #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 6px; -webkit-overflow-scrolling: touch; }
        .message { max-width: 80%; padding: 8px 12px; border-radius: 6px; font-size: 0.85em; line-height: 1.5; animation: fadeIn 0.3s ease; position: relative; word-break: break-word; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message .sender { font-size: 0.65em; color: var(--gold); letter-spacing: 1px; margin-bottom: 2px; font-weight: bold; }
        .message.own { align-self: flex-end; background: #1a3a5c; border: 1px solid #2a5070; }
        .message.other { align-self: flex-start; background: #1a1a2e; border: 1px solid var(--border); }
        .message.system { align-self: center; background: transparent; border: none; color: var(--text-dark); font-style: italic; font-size: 0.75em; max-width: 95%; text-align: center; }
        .message .report-btn { position: absolute; top: -8px; right: -8px; background: var(--danger); border: 1px solid #6b2020; color: #ffcccc; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 11px; display: none; align-items: center; justify-content: center; z-index: 5; }
        .message.other:hover .report-btn, .message.other:active .report-btn { display: flex; }
        .audio-msg { cursor: pointer; background: #1a3050; padding: 8px 12px; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px; font-size: 0.8em; }
        #input-area { padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        #input-area select { background: var(--input-bg); color: var(--text); border: 1px solid var(--border); padding: 8px 10px; font-family: inherit; font-size: 0.8em; border-radius: 3px; min-width: 100px; }
        #input-area input { flex: 1; min-width: 100px; background: var(--input-bg); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; font-family: inherit; font-size: 0.85em; border-radius: 3px; }
        #input-area button { padding: 8px 14px; white-space: nowrap; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; display: flex; align-items: center; justify-content: center; }
        .modal { background: var(--panel); border: 1px solid var(--gold); padding: 20px; max-width: 500px; width: 92%; border-radius: 6px; max-height: 85vh; overflow-y: auto; }
        .modal h2 { color: var(--gold); letter-spacing: 2px; margin-bottom: 14px; font-weight: normal; text-transform: uppercase; font-size: 1em; }
        .modal label { display: block; color: var(--text-dark); font-size: 0.7em; letter-spacing: 1px; margin: 10px 0 3px; text-transform: uppercase; }
        .modal input, .modal textarea { width: 100%; background: var(--input-bg); color: var(--text); border: 1px solid var(--border); padding: 10px; font-family: inherit; font-size: 0.85em; border-radius: 3px; }
        .modal textarea { min-height: 70px; resize: vertical; }
        .modal .btn-row { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
        #graveyard, #guide-panel { position: fixed; bottom: 16px; background: var(--panel); padding: 12px; border-radius: 6px; z-index: 150; max-width: 300px; font-size: 0.8em; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
        #graveyard { right: 10px; border: 1px solid #3a2a1a; }
        #guide-panel { left: 10px; border: 1px solid var(--gold); }
        .tombstone { font-size: 0.75em; padding: 5px 0; border-bottom: 1px solid #2a1a1a; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .report-item { background: var(--chat-bg); padding: 8px; margin-bottom: 6px; border-radius: 3px; font-size: 0.75em; border: 1px solid var(--border); }
        .report-item .btns { display: flex; gap: 4px; margin-top: 6px; }
        .hidden { display: none !important; }
        .text-gold { color: var(--gold); }
        .text-danger { color: #cc6666; }
        @media (max-width: 768px) {
            #main-container { flex-direction: column; }
            #sidebar { width: 100%; max-height: 180px; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; overflow-x: auto; }
            .location-card { flex: 0 0 auto; min-width: 90px; padding: 8px 10px; margin: 0; text-align: center; }
            .location-card .name { font-size: 0.7em; }
            .location-card .capacity { font-size: 0.6em; }
            #chat-area { min-height: 50vh; }
            #graveyard, #guide-panel { position: static; margin: 6px; max-width: none; font-size: 0.75em; }
            .message { max-width: 90%; font-size: 0.8em; }
        }
    </style>
</head>
<body>
    <div id="top-bar">
        <div><h1>Liar's World</h1><span class="subtitle">Speak. Lie. Survive.</span></div>
        <div id="user-area">
            <span id="current-role-display">👤 Not in character</span>
            <button class="btn small" id="btn-create-char">+ New</button>
            <button class="btn small danger" id="btn-graveyard">🪦 <span id="grave-count">0</span></button>
            <button class="btn small" id="btn-guide" style="border-color:#c9a96e;">⚖️ <span id="report-count">0</span></button>
        </div>
    </div>
    <div id="main-container">
        <div id="sidebar">
            <h2>📍 Village</h2>
            <div id="location-list" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
            <div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border);width:100%;"><p style="font-size:0.6em;color:var(--text-dark);line-height:1.5;"><em>All identities are lies. One flaw = death. English only. The Chief knows why.</em></p></div>
        </div>
        <div id="chat-area">
            <div id="chat-header"><h3 id="chat-title">Select a location</h3><span class="player-count" id="player-count"></span></div>
            <div id="messages"><div class="message system">Welcome to <span class="text-gold">Liar's World</span>.</div></div>
            <div id="input-area">
                <select id="speak-as"><option value="">-- Speak as... --</option></select>
                <input type="text" id="chat-input" placeholder="English only..." disabled>
                <button class="btn" id="voice-btn" disabled>🎤</button>
                <button class="btn" id="send-btn" disabled>Send</button>
            </div>
        </div>
    </div>
    <div id="graveyard" class="hidden"><h4>🪦 Graveyard</h4><div id="tombstone-list"></div></div>
    <div id="guide-panel" class="hidden"><h4>⚖️ Guide — Reports</h4><div id="report-list"></div></div>
    <div id="modal-character" class="modal-overlay hidden">
        <div class="modal">
            <h2>Create Your Lie</h2>
            <label>Name</label><input type="text" id="char-name" placeholder="e.g. Elias Thornwood">
            <label>Identity</label><input type="text" id="char-identity" placeholder="e.g. Wandering Merchant">
            <label>Occupation</label><input type="text" id="char-job" placeholder="e.g. Blacksmith">
            <label>Age</label><input type="number" id="char-age" placeholder="e.g. 34" min="16" max="120">
            <label>Reason for Coming</label><textarea id="char-reason" placeholder="Why are you here...?"></textarea>
            <div class="btn-row"><button class="btn" id="btn-cancel-char">Cancel</button><button class="btn" id="btn-submit-char" style="background:var(--highlight);">Enter Village</button></div>
        </div>
    </div>
    <div id="modal-report" class="modal-overlay hidden">
        <div class="modal">
            <h2>Report Flaw</h2>
            <label>What's the contradiction?</label><textarea id="report-reason" placeholder="Explain..."></textarea>
            <p id="report-target-display" style="font-size:0.75em;margin-top:6px;"></p>
            <div class="btn-row"><button class="btn" id="btn-cancel-report">Cancel</button><button class="btn danger" id="btn-submit-report">Submit</button></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
