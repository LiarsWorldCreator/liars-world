<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Liar's World</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #1a1a2e;
            --panel: #16213e;
            --border: #0f3460;
            --gold: #c9a96e;
            --text: #e0d5c1;
            --text-dark: #8b7d6b;
            --danger: #8b3a3a;
            --success: #3a6b3a;
            --highlight: #2a4a7f;
            --chat-bg: #0d1b2a;
            --input-bg: #1c2a3a;
            --recording: #cc3333;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        #top-bar {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        #top-bar h1 {
            font-size: 1.1em;
            letter-spacing: 2px;
            color: var(--gold);
            cursor: pointer;
        }
        #user-area {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        #current-role-display {
            background: var(--highlight);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75em;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        #current-role-display img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #333;
        }
        .btn {
            background: var(--border);
            color: var(--text);
            border: 1px solid var(--gold);
            padding: 6px 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75em;
            border-radius: 3px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn:hover {
            background: var(--highlight);
            border-color: #e0c080;
            color: #fff;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn.danger {
            border-color: var(--danger);
        }
        .btn.danger:hover {
            background: var(--danger);
        }
        .btn.small {
            padding: 4px 8px;
            font-size: 0.65em;
        }
        .btn.recording {
            background: var(--recording);
            border-color: #ff4444;
            animation: pulse 0.8s infinite;
            color: #fff;
        }
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(204, 51, 51, 0.5);
            }
            50% {
                box-shadow: 0 0 0 12px rgba(204, 51, 51, 0);
            }
        }
        .badge {
            background: var(--danger);
            color: #fff;
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 0.6em;
            min-width: 16px;
            text-align: center;
        }
        #main-container {
            display: flex;
            height: calc(100vh - 56px);
        }
        #sidebar {
            width: 280px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 10px;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #sidebar h2 {
            font-size: 0.8em;
            color: var(--gold);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        #daily-task-box {
            background: var(--chat-bg);
            border: 1px solid var(--gold);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.7em;
        }
        #daily-task-box h4 {
            color: var(--gold);
            margin-bottom: 4px;
            font-size: 0.8em;
        }
        .location-card {
            background: var(--chat-bg);
            border: 1px solid var(--border);
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            font-size: 0.85em;
        }
        .location-card:hover {
            border-color: var(--gold);
        }
        .location-card.active {
            border-color: var(--gold);
            background: #121e32;
            box-shadow: 0 0 12px rgba(201, 169, 110, 0.2);
        }
        .location-card .capacity {
            font-size: 0.65em;
            color: var(--text-dark);
        }
        .location-card .capacity.full {
            color: var(--danger);
        }
        .location-card .rules {
            font-size: 0.6em;
            color: var(--text-dark);
            font-style: italic;
            margin-top: 2px;
        }
        #chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
        }
        #chat-header {
            background: var(--panel);
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #chat-header h3 {
            color: var(--gold);
            font-size: 0.9em;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            -webkit-overflow-scrolling: touch;
        }
        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            position: relative;
            word-break: break-word;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message .sender {
            font-size: 0.65em;
            color: var(--gold);
            font-weight: bold;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .message .sender img {
            width: 18px;
            height: 18px;
            border-radius: 50%;
        }
        .message.own {
            align-self: flex-end;
            background: #1a3a5c;
            border: 1px solid #2a5070;
        }
        .message.other {
            align-self: flex-start;
            background: #1a1a2e;
            border: 1px solid var(--border);
        }
        .message.system {
            align-self: center;
            color: var(--text-dark);
            font-style: italic;
            font-size: 0.75em;
            text-align: center;
            max-width: 95%;
        }
        .report-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--danger);
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 11px;
            display: none;
            border: none;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }
        .message.other:hover .report-btn,
        .message.other:active .report-btn {
            display: inline-flex;
        }
        .voice-msg {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1a3050;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8em;
            user-select: none;
        }
        .voice-msg .play-icon {
            font-size: 1.1em;
        }
        .voice-msg .duration {
            font-size: 0.7em;
            color: var(--text-dark);
        }
        .voice-msg .progress-bar {
            width: 50px;
            height: 3px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
        }
        .voice-msg .progress-fill {
            height: 100%;
            background: var(--gold);
            width: 0%;
            transition: width 0.1s linear;
        }
        .voice-msg.playing {
            background: #2a4060;
        }
        #input-area {
            padding: 10px 12px;
            background: var(--panel);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        #input-area select {
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 3px;
            font-family: inherit;
            font-size: 0.8em;
            max-width: 140px;
        }
        #input-area input {
            flex: 1;
            min-width: 100px;
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 3px;
            font-family: inherit;
            font-size: 0.85em;
        }
        #voice-btn {
            font-size: 1.2em;
            padding: 8px 14px;
            min-width: 44px;
        }
        #cancel-voice-btn {
            display: none;
            background: #555;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.7em;
        }
        #recording-status {
            display: none;
            color: #ff6666;
            font-size: 0.7em;
            animation: pulse 0.8s infinite;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal {
            background: var(--panel);
            border: 1px solid var(--gold);
            padding: 20px;
            width: 92%;
            max-width: 500px;
            border-radius: 6px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal h2 {
            color: var(--gold);
            margin-bottom: 12px;
            font-size: 1em;
            letter-spacing: 1px;
        }
        .modal label {
            display: block;
            color: var(--text-dark);
            font-size: 0.7em;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .modal input,
        .modal textarea,
        .modal select {
            width: 100%;
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 10px;
            margin-top: 4px;
            border-radius: 3px;
            font-family: inherit;
            font-size: 0.85em;
        }
        .modal textarea {
            min-height: 60px;
            resize: vertical;
        }
        .modal .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .hidden {
            display: none !important;
        }
        #online-panel {
            position: fixed;
            top: 56px;
            right: 10px;
            background: var(--panel);
            border: 1px solid var(--gold);
            padding: 12px;
            border-radius: 6px;
            z-index: 150;
            max-width: 240px;
            max-height: 50vh;
            overflow-y: auto;
            font-size: 0.75em;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }
        #online-panel h4 {
            color: var(--gold);
            margin-bottom: 8px;
            font-size: 0.8em;
            letter-spacing: 1px;
        }
        .online-player {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 0;
            border-bottom: 1px solid #1a1a2e;
            font-size: 0.8em;
        }
        .online-player img {
            width: 22px;
            height: 22px;
            border-radius: 50%;
        }
        .online-player .loc {
            font-size: 0.65em;
            color: var(--text-dark);
        }
        #graveyard,
        #guide-panel {
            position: fixed;
            bottom: 10px;
            background: var(--panel);
            padding: 10px;
            border-radius: 6px;
            z-index: 150;
            font-size: 0.75em;
            max-width: 300px;
            max-height: 40vh;
            overflow-y: auto;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }
        #graveyard {
            right: 10px;
            border: 1px solid #3a2a1a;
        }
        #guide-panel {
            left: 10px;
            border: 1px solid var(--gold);
        }
        #admin-panel {
            position: fixed;
            top: 56px;
            left: 10px;
            background: var(--panel);
            border: 1px solid var(--gold);
            padding: 14px;
            border-radius: 6px;
            z-index: 160;
            width: 300px;
            max-height: 70vh;
            overflow-y: auto;
            font-size: 0.75em;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }
        #admin-panel h4 {
            color: var(--gold);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .feedback-banner {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel);
            border: 1px solid var(--gold);
            padding: 10px 20px;
            border-radius: 6px;
            z-index: 300;
            font-size: 0.8em;
            animation: fadeIn 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        @media (max-width: 768px) {
            #main-container {
                flex-direction: column;
            }
            #sidebar {
                width: 100%;
                max-height: 180px;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 4px;
                overflow-x: auto;
            }
            #sidebar h2 {
                display: none;
            }
            #daily-task-box {
                flex: 0 0 auto;
                min-width: 120px;
                font-size: 0.6em;
            }
            .location-card {
                flex: 0 0 auto;
                min-width: 80px;
                text-align: center;
                font-size: 0.7em;
            }
            #chat-area {
                min-height: 50vh;
            }
            #online-panel {
                top: auto;
                bottom: 50px;
                right: 4px;
                max-width: 180px;
                font-size: 0.65em;
            }
            #graveyard,
            #guide-panel,
            #admin-panel {
                position: static;
                margin: 4px;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <div id="top-bar">
        <h1 onclick="location.reload()">Liar's World</h1>
        <div id="user-area">
            <span id="current-role-display" onclick="showCharacterCard()">👤 Not in character</span>
            <button class="btn small" id="btn-create-char">+ New</button>
            <button class="btn small" id="btn-online">👥 <span id="online-count">0</span></button>
            <button class="btn small danger" id="btn-graveyard">🪦 <span id="grave-count">0</span></button>
            <button class="btn small" id="btn-guide">⚖️ <span id="report-count">0</span></button>
            <button class="btn small" id="btn-admin">🔑 Admin</button>
        </div>
    </div>
    <div id="main-container">
        <div id="sidebar">
            <h2>📍 Village</h2>
            <div id="daily-task-box"><h4>📋 Today's Task</h4><p id="daily-task-text">Loading...</p></div>
            <div id="location-list" style="display:flex;flex-wrap:wrap;gap:4px;"></div>
        </div>
        <div id="chat-area">
            <div id="chat-header"><h3 id="chat-title">Select a location</h3><span id="scene-rules" style="font-size:0.65em;color:var(--text-dark);"></span></div>
            <div id="messages"><div class="message system">Welcome to <span style="color:var(--gold);">Liar's World</span>. Create a character to begin.</div></div>
            <div id="input-area">
                <select id="speak-as"><option value="">-- Speak as... --</option></select>
                <input type="text" id="chat-input" placeholder="English only..." disabled>
                <button class="btn" id="voice-btn" disabled>🎤</button>
                <button class="btn" id="cancel-voice-btn">✕</button>
                <span id="recording-status">🔴 Recording...</span>
                <button class="btn" id="send-btn" disabled>Send</button>
            </div>
        </div>
    </div>
    <div id="online-panel" class="hidden"><h4>👥 Online Now</h4><div id="online-list"></div></div>
    <div id="graveyard" class="hidden"><h4>🪦 Graveyard</h4><div id="tombstone-list"></div></div>
    <div id="guide-panel" class="hidden"><h4>⚖️ Reports</h4><div id="report-list"></div></div>
    <div id="admin-panel" class="hidden">
        <h4>🔑 Admin Panel</h4>
        <div id="admin-login">
            <label>Password</label><input type="password" id="admin-password" placeholder="Enter admin password...">
            <button class="btn" id="btn-admin-login" style="margin-top:6px;">Login</button>
        </div>
        <div id="admin-content" class="hidden">
            <label>Set Daily Task</label>
            <select id="admin-task-location"><option value="all">All Locations</option></select>
            <textarea id="admin-task-text" placeholder="Today's task description..."></textarea>
            <button class="btn" id="btn-set-task" style="margin-top:4px;">Publish Task</button>
            <hr style="border-color:var(--border);margin:8px 0;">
            <label>Force Execute Player</label>
            <select id="admin-force-execute"></select>
            <button class="btn danger" id="btn-force-execute" style="margin-top:4px;">💀 Execute</button>
            <hr style="border-color:var(--border);margin:8px 0;">
            <label>Delete Voice Message (enter message ID)</label>
            <input type="text" id="admin-delete-voice" placeholder="Message UUID...">
            <button class="btn danger" id="btn-delete-voice" style="margin-top:4px;">🗑️ Delete</button>
            <button class="btn" id="btn-admin-logout" style="margin-top:8px;">Logout</button>
        </div>
    </div>
    <div id="modal-character" class="modal-overlay hidden">
        <div class="modal">
            <h2>Create Your Lie</h2>
            <label>Avatar</label>
            <div style="display:flex;align-items:center;gap:10px;margin-top:4px;">
                <img id="avatar-preview" src="" style="width:50px;height:50px;border-radius:50%;background:#333;">
                <button class="btn small" id="btn-random-avatar">🎲 Random</button>
                <input type="text" id="char-avatar-seed" placeholder="Seed word..." style="flex:1;">
            </div>
            <label>Name</label><input type="text" id="char-name" placeholder="e.g. Elias Thornwood">
            <label>Identity</label><input type="text" id="char-identity" placeholder="e.g. Wandering Merchant">
            <label>Occupation</label><input type="text" id="char-job" placeholder="e.g. Blacksmith">
            <label>Age</label><input type="number" id="char-age" placeholder="e.g. 34" min="16" max="120">
            <label>Reason for Coming</label><textarea id="char-reason" placeholder="Why are you here...?"></textarea>
            <div class="btn-row"><button class="btn" id="btn-cancel-char">Cancel</button><button class="btn" id="btn-submit-char">Enter Village</button></div>
        </div>
    </div>
    <div id="modal-report" class="modal-overlay hidden">
        <div class="modal">
            <h2>Report Logical Flaw</h2>
            <label>What's the contradiction?</label><textarea id="report-reason" placeholder="Explain the logical flaw clearly..."></textarea>
            <p id="report-target-display" style="font-size:0.75em;margin-top:6px;"></p>
            <div class="btn-row"><button class="btn" id="btn-cancel-report">Cancel</button><button class="btn danger" id="btn-submit-report">Submit Report</button></div>
        </div>
    </div>
    <div id="modal-character-card" class="modal-overlay hidden">
        <div class="modal">
            <h2>Character Card</h2>
            <div id="character-card-content"></div>
            <div class="btn-row"><button class="btn" id="btn-close-card">Close</button></div>
        </div>
    </div>

    // === 语音录制（修复版）===
    async function startRecording() {
        if (!currentLocation || !currentCharacterId) { alert('Enter a location first.'); return; }
        if (isRecording) return;
        if (isSendingVoice) return; // 正在发送中，不允许再次录音
        try {
            var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
            audioChunks = [];
            recordingStartTime = Date.now();
            isSendingVoice = false;

            mediaRecorder.ondataavailable = function(e) {
                if (e.data.size > 0) audioChunks.push(e.data);
            };

            mediaRecorder.onstop = async function() {
                stream.getTracks().forEach(function(t) { t.stop(); });
                clearInterval(recordingTimer);
                var duration = (Date.now() - recordingStartTime) / 1000;
                $('cancel-voice-btn').style.display = 'none';
                $('recording-status').style.display = 'none';

                // 如果被取消（audioChunks为空），直接重置
                if (audioChunks.length === 0 || isSendingVoice === false) {
                    // 检查是不是真的要发送
                    if (audioChunks.length === 0) {
                        resetVoiceBtn();
                        return;
                    }
                }

                // 防止重复发送
                if (isSendingVoice) return;
                isSendingVoice = true;

                var blob = new Blob(audioChunks, { type: 'audio/webm' });
                var char = currentCharacters.find(function(c) { return c.id === currentCharacterId; });
                var path = 'voice_' + Date.now() + '.webm';

                var uploadRes = await db.storage.from('voice_messages').upload(path, blob, { contentType: 'audio/webm', cacheControl: '3600' });
                if (uploadRes.error) {
                    alert('Upload failed. Please try again.');
                    resetVoiceBtn();
                    isSendingVoice = false;
                    return;
                }

                var urlRes = db.storage.from('voice_messages').getPublicUrl(path);
                await db.from('messages').insert({
                    location_id: currentLocation,
                    char_id: currentCharacterId,
                    char_name: char.name,
                    audio_url: urlRes.data.publicUrl,
                    type: 'chat',
                    duration: Math.round(duration)
                });

                resetVoiceBtn();
                isSendingVoice = false;
            };

            mediaRecorder.start(100);
            isRecording = true;
            $('voice-btn').classList.add('recording');
            $('voice-btn').textContent = '🔴';
            $('cancel-voice-btn').style.display = 'inline-block';
            $('recording-status').style.display = 'inline';
            recordingTimer = setInterval(function() {
                $('recording-status').textContent = '🔴 ' + Math.floor((Date.now() - recordingStartTime) / 1000) + 's';
            }, 500);
        } catch (e) {
            alert('Microphone access needed.');
        }
    }

    function stopRecording() {
        if (mediaRecorder && isRecording && mediaRecorder.state === 'recording') {
            // 标记为要发送
            isSendingVoice = true;
            mediaRecorder.stop();
        }
    }

    function cancelRecording() {
        if (mediaRecorder && isRecording) {
            // 标记为取消（不发送）
            isSendingVoice = false;
            audioChunks = [];
            var stream = mediaRecorder.stream;
            mediaRecorder.onstop = function() {
                if (stream) stream.getTracks().forEach(function(t) { t.stop(); });
                clearInterval(recordingTimer);
                resetVoiceBtn();
            };
            mediaRecorder.stop();
        }
    }

    function resetVoiceBtn() {
        $('voice-btn').classList.remove('recording');
        $('voice-btn').textContent = '🎤';
        $('cancel-voice-btn').style.display = 'none';
        $('recording-status').style.display = 'none';
        isRecording = false;
    }

    // === 语音播放 ===
    function playAudio(url, voiceMsgEl) {
        if (currentAudio) {
            currentAudio.pause();
            if (currentAudioMsg) {
                currentAudioMsg.classList.remove('playing');
                currentAudioMsg.querySelector('.play-icon').textContent = '▶';
                currentAudioMsg.querySelector('.progress-fill').style.width = '0%';
            }
            if (currentAudioMsg === voiceMsgEl) { currentAudio = null; currentAudioMsg = null; return; }
        }
        var audio = new Audio(url);
        currentAudio = audio;
        currentAudioMsg = voiceMsgEl;
        voiceMsgEl.classList.add('playing');
        voiceMsgEl.querySelector('.play-icon').textContent = '⏸';
        var progressFill = voiceMsgEl.querySelector('.progress-fill');
        var totalDur = parseFloat(voiceMsgEl.dataset.duration) || 0;
        audio.ontimeupdate = function() {
            if (audio.duration && totalDur > 0) progressFill.style.width = Math.min((audio.currentTime / totalDur) * 100, 100) + '%';
        };
        audio.onended = function() {
            voiceMsgEl.classList.remove('playing');
            voiceMsgEl.querySelector('.play-icon').textContent = '▶';
            progressFill.style.width = '0%';
            currentAudio = null;
            currentAudioMsg = null;
        };
        audio.onerror = function() { voiceMsgEl.querySelector('.play-icon').textContent = '⚠️'; };
        audio.play().catch(function() { voiceMsgEl.querySelector('.play-icon').textContent = '▶'; });
    }

    async function handleReport(reportId, action) {
        if (!isAdmin) return alert('Only the Guide can judge reports.');
        var res = await db.from('reports').select('*').eq('id', reportId).single();
        var r = res.data;
        if (!r || r.status !== 'pending') return;
        if (action === 'approve') {
            await db.from('reports').update({ status: 'approved', reporter_feedback: 'Report upheld.', reported_feedback: 'Executed for contradiction.' }).eq('id', reportId);
            await db.from('characters').update({ alive: false }).eq('id', r.reported_char_id);
            var char = currentCharacters.find(function(c) { return c.id === r.reported_char_id; });
            await db.from('graveyard').insert({ char_id: r.reported_char_id, char_name: char ? char.name : 'Unknown', reason: r.reason });
            if (currentCharacterId === r.reported_char_id) { currentCharacterId = null; updateUI(); }
            showBanner('💀 ' + (char ? char.name : 'Someone') + ' executed.');
        } else {
            await db.from('reports').update({ status: 'rejected', reporter_feedback: 'Report dismissed.', reported_feedback: 'Report dismissed.' }).eq('id', reportId);
            showBanner('Report dismissed.');
        }
        await loadCharacters();
        updateGuidePanel();
        updateGraveyard();
    }

        if (e.target.dataset.revive) {
            await db.from('graveyard').delete().eq('id', e.target.dataset.grave);
            await db.from('characters').delete().eq('id', e.target.dataset.revive);
            await loadCharacters();
            updateGraveyard();
            $('modal-character').classList.remove('hidden');
        }
        var senderEl = e.target.closest('.sender');
        if (senderEl && !e.target.closest('.voice-msg') && !e.target.closest('.report-btn')) {
            var msgEl = senderEl.closest('.message');
            if (msgEl && msgEl.classList.contains('other')) {
                var reportBtn = msgEl.querySelector('.report-btn');
                if (reportBtn) showCharacterCard(reportBtn.dataset.char);
            }
        }
    });

    // === 按钮事件绑定 ===
    $('btn-create-char').onclick = function() {
        $('char-avatar-seed').value = randomAvatarSeed();
        updateAvatarPreview();
        ['char-name', 'char-identity', 'char-job', 'char-age', 'char-reason'].forEach(function(id) { $(id).value = ''; });
        $('modal-character').classList.remove('hidden');
    };
    $('btn-random-avatar').onclick = function() { $('char-avatar-seed').value = randomAvatarSeed(); updateAvatarPreview(); };
    $('char-avatar-seed').oninput = updateAvatarPreview;
    $('char-name').oninput = updateAvatarPreview;
    $('btn-cancel-char').onclick = function() { $('modal-character').classList.add('hidden'); };
    $('btn-submit-char').onclick = submitCharacter;
    $('btn-cancel-report').onclick = function() { $('modal-report').classList.add('hidden'); };
    $('btn-submit-report').onclick = submitReport;
    $('btn-close-card').onclick = function() { $('modal-character-card').classList.add('hidden'); };
    $('btn-online').onclick = function() { $('online-panel').classList.toggle('hidden'); loadOnlinePlayers(); };
    $('btn-graveyard').onclick = function() { $('graveyard').classList.toggle('hidden'); };
    $('btn-guide').onclick = function() { $('guide-panel').classList.toggle('hidden'); };
    $('btn-admin').onclick = function() {
        $('admin-panel').classList.toggle('hidden');
        if (!isAdmin) { $('admin-login').classList.remove('hidden');
            $('admin-content').classList.add('hidden'); } else { populateAdminSelects(); }
    };
    $('btn-admin-login').onclick = adminLogin;
    $('admin-password').onkeydown = function(e) { if (e.key === 'Enter') adminLogin(); };
    $('btn-set-task').onclick = setDailyTask;
    $('btn-force-execute').onclick = forceExecute;
    $('btn-delete-voice').onclick = deleteVoiceMessage;
    $('btn-admin-logout').onclick = adminLogout;
    $('send-btn').onclick = sendMessage;
    $('chat-input').onkeydown = function(e) { if (e.key === 'Enter') sendMessage(); };

    // 语音按钮事件
    $('voice-btn').addEventListener('mousedown', function(e) { e.preventDefault();
        startRecording(); });
    $('voice-btn').addEventListener('mouseup', function(e) { e.preventDefault();
        stopRecording(); });
    $('voice-btn').addEventListener('mouseleave', function(e) { if (isRecording) stopRecording(); });
    $('voice-btn').addEventListener('touchstart', function(e) { e.preventDefault();
        startRecording(); });
    $('voice-btn').addEventListener('touchend', function(e) { e.preventDefault();
        stopRecording(); });
    $('cancel-voice-btn').addEventListener('click', cancelRecording);
    $('cancel-voice-btn').addEventListener('mousedown', function(e) { e.preventDefault(); });

    $('speak-as').onchange = function() {
        currentCharacterId = this.value || null;
        if (currentCharacterId) localStorage.setItem('liars_world_current_char', currentCharacterId);
        else localStorage.removeItem('liars_world_current_char');
        updateUI();
        updateOnlineStatus();
    };

    window.addEventListener('beforeunload', function() {
        if (currentCharacterId) db.from('online_players').delete().eq('char_id', currentCharacterId);
    });

    // === 启动 ===
    (async function init() {
        await loadCharacters();
        await loadDailyTask();
        renderLocations();
        updateSpeakAsList();
        updateGraveyard();
        updateGuidePanel();
        loadOnlinePlayers();
        subscribeAll();
        setInterval(checkGraveyardTimers, 5000);
        var saved = localStorage.getItem('liars_world_current_char');
        if (saved && currentCharacters.find(function(c) { return c.id === saved && c.alive; })) {
            currentCharacterId = saved;
            updateUI();
            updateOnlineStatus();
        }
        console.log('✅ Liar\'s World Ready');
    })();
})();
